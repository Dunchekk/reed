name: Reed
options:
  bundleIdPrefix: dev.dunchekk
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
packages:
  ReedCore:
    path: ReedCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Reed:
    type: application
    platform: iOS
    sources:
      - path: Reed
        excludes: ["**/README.md"]
    dependencies:
      - package: ReedCore
        product: ReedDomain
      - package: ReedCore
        product: ReedApplication
      - package: ReedCore
        product: ReedPersistence
    settings:
      base:
        REED_API_BASE_URL: ""
        INFOPLIST_KEY_ReedAPIBaseURL: "$(REED_API_BASE_URL)"
        PRODUCT_BUNDLE_IDENTIFIER: dev.dunchekk.reed
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Reed
        INFOPLIST_KEY_NSCameraUsageDescription: "Снять страницу и распознать текст на устройстве."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    scheme:
      gatherCoverageData: true
      testTargets: [ReedTests, ReedUITests]
  ReedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ReedUITests
        excludes: ["README.md"]
    dependencies:
      - target: Reed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dunchekk.reed.uitests
        GENERATE_INFOPLIST_FILE: YES
  ReedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReedTests
        excludes: ["README.md"]
    dependencies:
      - target: Reed
      - package: ReedCore
        product: ReedDomain
      - package: ReedCore
        product: ReedApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dunchekk.reed.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Reed.app/Reed"
        BUNDLE_LOADER: "$(TEST_HOST)"
