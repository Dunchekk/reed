name: reed
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reed_dev
      POSTGRES_USER: reed_dev
      POSTGRES_PASSWORD: reed_local_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - reed_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reed_dev -d reed_dev"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  reed_postgres:
